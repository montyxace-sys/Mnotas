name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore
        run: dotnet restore

      - name: Build portable (single-file)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist\portable

      - name: Prepare MSI publish
        run: |
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Copy-Item dist\portable\Mnotas.exe publish\Mnotas.exe

      - name: Build MSI
        run: wix build installer.wxs -o dist\Mnotas-x64.msi

      # ---------- Firma digital (opcional) ----------
      # Para activar la firma, crea en el repositorio los secrets:
      #   CODE_SIGN_CERT      -> certificado PFX en base64 (certutil -encode cert.pfx cert.b64)
      #   CODE_SIGN_PASSWORD  -> contraseña del PFX
      # Con un certificado EV, SmartScreen deja de marcar el ejecutable como desconocido.
      - name: Locate signtool
        id: signtool
        run: |
          $st = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $st) { Write-Host "signtool no encontrado"; exit 1 }
          echo "path=$st" >> $env:GITHUB_OUTPUT
          Write-Host "signtool: $st"

      - name: Sign binaries (if cert provided)
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT)) {
            Write-Host "No se proporciono certificado de firma. Se omite la firma."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $st = "${{ steps.signtool.outputs.path }}"
          & $st sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $certPath /p $env:CODE_SIGN_PASSWORD "dist\portable\Mnotas.exe"
          & $st sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $certPath /p $env:CODE_SIGN_PASSWORD "dist\Mnotas-x64.msi"
          & $st verify /pa "dist\portable\Mnotas.exe"
          & $st verify /pa "dist\Mnotas-x64.msi"
          Remove-Item $certPath -Force

      - name: Generate SHA256SUMS (after signing)
        run: |
          $files = @("dist\portable\Mnotas.exe", "dist\Mnotas-x64.msi")
          $lines = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $f -Leaf
            $lines += "$hash  $name"
          }
          $lines | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mnotas
          path: |
            dist/portable/Mnotas.exe
            dist/Mnotas-x64.msi
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/portable/Mnotas.exe
            dist/Mnotas-x64.msi
            dist/SHA256SUMS.txt
          generate_release_notes: true
